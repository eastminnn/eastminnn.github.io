# main 브랜치에 푸시하면 정적 사이트를 빌드해서 GitHub Pages에 배포한다.
# 잔디 그래프는 빌드할 때 가져오므로, 매일 한 번 다시 빌드해서 최신으로 유지한다.
name: Deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 15 * * *" # 매일 한국 시간 자정
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
